# SearXNG for the web search tool (compose.yaml). Only the app talks to it: it is not published outside the compose network.
use_default_settings: true
general:
  instance_name: "Korvex AI Chat search"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
server:
  limiter: false
  image_proxy: false
  public_instance: false
search:
  formats:
    - html
    - json
  safe_search: 1
  default_lang: "auto"
  suspended_times:
    SearxEngineTooManyRequests: 900
    SearxEngineAccessDenied: 3600
    SearxEngineCaptcha: 3600
outgoing:
  request_timeout: 6.0
  max_request_timeout: 10.0
# Engines that answer server requests well; the big ones that often show a captcha to servers are off.
engines:
  - name: bing
    disabled: false
  - name: bing news
    disabled: false
    categories: [news, general]
  - name: duckduckgo news
    disabled: false
    categories: [news, general]
  - name: mojeek
    disabled: false
  - name: startpage
    disabled: false
  - name: wikipedia
    disabled: false
  - name: reddit
    disabled: false
  - name: hackernews
    disabled: false
  - name: arxiv
    disabled: false
  - name: google
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: qwant
    disabled: true
