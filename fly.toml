# Fly.io: fly launch --copy-config --no-deploy && fly volumes create korvex_data --size 5 && fly deploy
# The machine keeps running: answers are generated in the background and must not be cut by auto-stop.
app = "korvex-ai-chat"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  COOKIE_SECURE = "1"

[[mounts]]
  source = "korvex_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "40s"
  interval = "30s"
  method = "GET"
  path = "/login"
  timeout = "5s"
