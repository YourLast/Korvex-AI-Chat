<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Korvex AI — нет сети</title>
<style>html,body{height:100%;margin:0;background:#000;color:#ededed;font:15px/24px system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;text-align:center;padding:24px;padding-bottom:env(safe-area-inset-bottom)}img{width:40px;height:40px;margin-bottom:24px}p{color:#a1a1a1;margin:8px 0 0}button{margin-top:24px;height:40px;padding:0 16px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:#fff;color:#000;font:500 14px system-ui}</style></head>
<body><div><img src="/mark.png" alt=""><h1 id="h" style="font-size:22px;font-weight:500;margin:0">Нет соединения</h1><p id="p">Чаты и память доступны только онлайн.</p><button id="b" onclick="location.reload()">Повторить</button></div>
<script>
// язык: выбор человека (cookie/localStorage kx.lang), иначе язык устройства: sr/hr/bs/me -> srpski, ru/uk/be/kk -> русский, остальное -> English
(function () {
  var T = {
    ru: ['Нет соединения', 'Чаты и память доступны только онлайн.', 'Повторить', 'Korvex AI — нет сети'],
    en: ['No connection', 'Chats and memory are only available online.', 'Try again', 'Korvex AI — offline'],
    sr: ['Nema veze', 'Čatovi i memorija dostupni su samo onlajn.', 'Pokušaj ponovo', 'Korvex AI — nema mreže']
  };
  var tag = function (s) { s = String(s || '').toLowerCase().split(/[-_]/)[0]; return /^(sr|hr|bs|me|cnr|sh)$/.test(s) ? 'sr' : /^(ru|uk|be|kk)$/.test(s) ? 'ru' : s === 'en' ? 'en' : null; };
  var lang = null;
  try { var m = /(?:^|;\s*)kx_lang=(ru|en|sr)/.exec(document.cookie); lang = m && m[1]; } catch (e) {}
  try { if (!lang) { var s = localStorage.getItem('kx.lang'); if (s === 'ru' || s === 'en' || s === 'sr') lang = s; } } catch (e) {}
  if (!lang) { var l = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language]; for (var i = 0; i < l.length && !lang; i++) lang = tag(l[i]); }
  var t = T[lang || 'en'];
  document.documentElement.lang = lang === 'sr' ? 'sr-Latn' : (lang || 'en');
  document.getElementById('h').textContent = t[0]; document.getElementById('p').textContent = t[1]; document.getElementById('b').textContent = t[2]; document.title = t[3];
})();
</script></body></html>
